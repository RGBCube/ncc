[package]
name    = "matrix-imagepack-sync"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "matrix-imagepack-sync"
path = "main.rs"

[dependencies]
anyhow     = "1.0.102"
clap       = { features = [ "derive", "env" ], version = "4.6.1" }
matrix-sdk = { default-features = false, version = "0.18.0" }
mime_guess = "2.0.5"
reqwest    = { default-features = false, features = [ "json" ], version = "0.13.1" }
ruma       = { default-features = false, features = [ "unstable-msc2545" ], version = "0.16" }
serde      = { features = [ "derive" ], version = "1.0.228" }
tokio      = { default-features = false, features = [ "rt-multi-thread", "macros" ], version = "1.52.3" }
